groups:
  - name: Commvault
    rules:
      - alert: CommvaultServiceDown
        expr: windows_service_info{display_name=~"Commvault.*"} and ON(instance, name) windows_service_start_mode{start_mode="auto"} == 1 and ON (instance, name) windows_service_state{state="running"} != 1
        for: 5m
        labels:
          severity: warning
          ostype: windows
        annotations:
          summary: 'CommvaultServiceDown on {{ $labels.fqdn }}'
          description: '{{ $labels.display_name }} [{{ $labels.name }}] down on {{ $labels.fqdn }}'

  - name: Kace
    rules:
      - alert: KaceServiceDown
        expr: windows_service_info{display_name=~"Quest.*"} and ON(instance, name) windows_service_start_mode{start_mode="auto"} == 1 and ON (instance, name) windows_service_state{state="running"} != 1
        for: 5m
        labels:
          severity: warning
          ostype: windows
        annotations:
          summary: 'KaceServiceDown on {{ $labels.fqdn }}'
          description: '{{ $labels.display_name }} [{{ $labels.name }}] down on {{ $labels.fqdn }}'

  - name: Microsoft
    rules:
      - alert: MSAzureATPServiceDown
        expr: windows_service_info{display_name=~"Azure Advanced Threat Protection .*"} and ON(instance, name) windows_service_start_mode{start_mode="auto"} == 1 and ON (instance, name) windows_service_state{state="running"} != 1
        for: 5m
        labels:
          severity: warning
          ostype: windows
        annotations:
          summary: 'MSAzureATPServiceDown on {{ $labels.fqdn }}'
          description: '{{ $labels.display_name }} [{{ $labels.name }}] down on {{ $labels.fqdn }}'

      - alert: MSExchangeServiceDown
        expr: windows_service_info{display_name=~"Microsoft Exchange.*"} and ON(instance, name) windows_service_info{display_name!="Microsoft Exchange Notifications Broker"} and ON(instance, name) windows_service_start_mode{start_mode="auto"} == 1 and ON (instance, name) windows_service_state{state="running"} != 1
        for: 5m
        labels:
          severity: critical
          ostype: windows
        annotations:
          summary: 'MSExchangeServiceDown on {{ $labels.fqdn }}'
          description: '{{ $labels.display_name }} [{{ $labels.name }}] down on {{ $labels.fqdn }}'

      - alert: MSSQLServiceDown
        expr: windows_service_info{display_name=~`SQL Server \(.*\)`} and ON(instance, name) windows_service_start_mode{start_mode="auto"} == 1 and ON (instance, name) windows_service_state{state="running"} != 1
        for: 5m
        labels:
          severity: critical
          ostype: windows
        annotations:
          summary: 'MSSQLServiceDown on {{ $labels.fqdn }}'
          description: '{{ $labels.display_name }} [{{ $labels.name }}] down on {{ $labels.fqdn }}'

      - alert: PowerBiDataGatewayServiceDown
        expr: windows_service_start_mode{name="pbiegwservice",start_mode="auto"} == 1 and ON (instance, name) windows_service_state{state="running"} != 1
        for: 5m
        labels:
          severity: critical
          ostype: windows
        annotations:
          summary: 'PowerBiDataGatewayServiceDown on {{ $labels.fqdn }}'
          description: '{{ $labels.display_name }} [{{ $labels.name }}] down on {{ $labels.fqdn }}'

  - name: NetApp
    rules:
      - alert: NetAppServiceDown
        expr: windows_service_info{display_name=~"NetApp.*"} and ON(instance, name) windows_service_start_mode{start_mode="auto"} == 1 and ON (instance, name) windows_service_state{state="running"} != 1
        for: 5m
        labels:
          severity: warning
          ostype: windows
        annotations:
          summary: 'NetAppServiceDown on {{ $labels.fqdn }}'
          description: '{{ $labels.display_name }} [{{ $labels.name }}] down on {{ $labels.fqdn }}'

  - name: Proxmox
    rules:
      - alert: ProxmoxQemuGuestAgentServiceDown
        expr: windows_service_info{name="qemu-ga"} and ON(instance, name) windows_service_start_mode{start_mode="auto"} == 1 and ON (instance, name) windows_service_state{state="running"} != 1
        for: 5m
        labels:
          severity: warning
          ostype: windows
        annotations:
          summary: 'ProxmoxQemuGuestAgentServiceDown on {{ $labels.fqdn }}'
          description: '{{ $labels.display_name }} [{{ $labels.name }}] down on {{ $labels.fqdn }}'

  - name: SecurityOpenSearch
    rules:
      - alert: FluentBitDown
        expr: windows_service_start_mode{name="fluent-bit",start_mode="auto"} == 1 and ON (instance, name) windows_service_state{state="running"} != 1
        for: 5m
        labels:
          severity: warning
          ostype: windows
        annotations:
          summary: 'FluentBitDown on {{ $labels.fqdn }}'
          description: '{{ $labels.display_name }} [{{ $labels.name }}] down on {{ $labels.fqdn }}'

  - name: ServiceNow
    rules:
      - alert: ServiceNowMIDServerDown
        expr: windows_service_info{display_name=~"ServiceNow.*"} and ON(instance, name) windows_service_start_mode{start_mode="auto"} == 1 and ON (instance, name) windows_service_state{state="running"} != 1
        for: 5m
        labels:
          severity: warning
          ostype: windows
        annotations:
          summary: 'ServiceNowMIDServerDown on {{ $labels.fqdn }}'
          description: '{{ $labels.display_name }} [{{ $labels.name }}] down on {{ $labels.fqdn }}'

  - name: Tenable
    rules:
      - alert: TenableServiceDown
        expr: windows_service_start_mode{name="Tenable Nessus Agent",start_mode="auto"} == 1 and ON (instance, name) windows_service_state{state="running"} != 1
        for: 5m
        labels:
          severity: warning
          ostype: windows
        annotations:
          summary: 'TenableServiceDown on {{ $labels.fqdn }}'
          description: '{{ $labels.display_name }} [{{ $labels.name }}] down on {{ $labels.fqdn }}'

  - name: VMware
    rules:
      - alert: VMwareToolsServiceDown
        expr: windows_service_info{name="VMTools"} and ON(instance, name) windows_service_start_mode{start_mode="auto"} == 1 and ON (instance, name) windows_service_state{state="running"} != 1
        for: 5m
        labels:
          severity: warning
          ostype: windows
        annotations:
          summary: 'VMwareToolsServiceDown on {{ $labels.fqdn }}'
          description: '{{ $labels.display_name }} [{{ $labels.name }}] down on {{ $labels.fqdn }}'

  - name: Windows
    rules:
      - alert: WindowsClockNotSynced
        expr: windows_time_clock_sync_source{type="NoSync"} == 1
        for: 5m
        labels:
          severity: warning
          ostype: windows
        annotations:
          summary: 'WindowsClockNotSynced on {{ $labels.fqdn }}'
          description: 'Windows time is not synchronised on {{ $labels.fqdn }}'

      - alert: WindowsCpuUsage
        expr: |
          (
            sum without (core) (
              clamp_max(
                rate(windows_cpu_processor_utility_total[5m])
                / rate(windows_cpu_processor_rtc_total[5m]),
                100
              )
            )
            / count without (core) (windows_cpu_processor_utility_total)
          ) > 95
        for: 30m
        labels:
          severity: warning
          ostype: windows
        annotations:
          summary: 'WindowsCpuUsage on {{ $labels.fqdn }}'
          description: 'CPU Usage is more than 95%{{"\n"}}VALUE = {{ $value }}'

      - alert: WindowsDiskFilling
        expr: |
          (100 * windows_logical_disk_free_bytes{volume!~"(Harddisk|C).*"}
            / windows_logical_disk_size_bytes{volume!~"(Harddisk|C).*"} < 15)
          and predict_linear(
            windows_logical_disk_free_bytes{volume!~"(Harddisk|C).*"}[6h],
            4 * 24 * 3600
          ) < 0
        for: 10m
        labels:
          severity: warning
          ostype: windows
        annotations:
          summary: 'WindowsDiskFilling on {{ $labels.fqdn }}'
          description: 'Drive {{ $labels.volume }} expected to fill within 4 days. Currently {{ $value | humanize }}% free.'

      - alert: WindowsDiskSpaceUsage
        expr: ((windows_logical_disk_size_bytes{volume!~"(Harddisk|C).*"} - windows_logical_disk_free_bytes{volume!~"(Harddisk|C).*"}) / windows_logical_disk_size_bytes{volume!~"(Harddisk|C).*"} * 100 > 90)
        for: 5m
        labels:
          severity: warning
          ostype: windows
        annotations:
          summary: 'WindowsDiskSpaceUsage on {{ $labels.fqdn }}'
          description: 'Disk Space on Drive ({{ $labels.volume }}) is used more than 90%{{"\n"}}VALUE = {{ $value }}'

      - alert: WindowsExporterDown
        expr: (up{instance=~".*:9182"} == 0)
        for: 15m
        labels:
          severity: critical
          ostype: windows
        annotations:
          summary: 'WindowsExporterDown on {{ $labels.fqdn }}'
          description: 'Windows Exporter is down on {{ $labels.fqdn }}{{"\n"}}Either is only exporter down or the whole server.{{"\n"}}Check ASAP'

      - alert: WindowsMemoryUsage
        expr: (100 - 100 * windows_memory_physical_free_bytes / windows_memory_physical_total_bytes > 95)
        for: 60m
        labels:
          severity: warning
          ostype: windows
        annotations:
          summary: 'WindowsMemoryUsage on {{ $labels.fqdn }}'
          description: 'Memory Usage is more than 95%{{"\n"}}VALUE = {{ $value }}'

      - alert: WindowsNetworkOutputQueueSaturated
        expr: windows_net_output_queue_length_packets > 2
        for: 5m
        labels:
          severity: warning
          ostype: windows
        annotations:
          summary: 'WindowsNetworkOutputQueueSaturated on {{ $labels.fqdn }}'
          description: 'Output queue length on NIC {{ $labels.nic }} is {{ $value }} (threshold: 2)'

      - alert: WindowsNetworkPacketErrors
        expr: (rate(windows_net_packets_received_errors_total[5m]) + rate(windows_net_packets_outbound_errors_total[5m])) > 10
        for: 5m
        labels:
          severity: warning
          ostype: windows
        annotations:
          summary: 'WindowsNetworkPacketErrors on {{ $labels.fqdn }}'
          description: 'High packet error rate on NIC {{ $labels.nic }}{{"\n"}}VALUE = {{ $value }}'

      - alert: WindowsNetworkUsage
        expr: ((rate(windows_net_bytes_total[5m]) * 8 / windows_net_current_bandwidth_bytes * 100) > 90)
        for: 5m
        labels:
          severity: warning
          ostype: windows
        annotations:
          summary: 'WindowsNetworkUsage on {{ $labels.fqdn }}'
          description: 'High network utilization on nic = {{ $labels.nic }}{{"\n"}}VALUE = {{ $value }}'

      - alert: WindowsNTPClientDelay
        expr: windows_time_ntp_round_trip_delay_seconds > 1
        for: 5m
        labels:
          severity: warning
          ostype: windows
        annotations:
          summary: 'WindowsNTPClientDelay on {{ $labels.fqdn }}'
          description: 'NTP round trip delay is {{ $value }}s (threshold: 1s)'

      - alert: WindowsNTPNoSources
        expr: windows_time_ntp_client_time_sources == 0
        for: 5m
        labels:
          severity: warning
          ostype: windows
        annotations:
          summary: 'WindowsNTPNoSources on {{ $labels.fqdn }}'
          description: 'No active NTP time sources on {{ $labels.fqdn }}'

      - alert: WindowsPhysicalDiskHighLatency
        expr: |
          (
            rate(windows_physical_disk_read_write_latency_seconds_total[5m])
            / (rate(windows_physical_disk_reads_total[5m]) + rate(windows_physical_disk_writes_total[5m]))
          ) > 0.4
          and (rate(windows_physical_disk_reads_total[5m]) + rate(windows_physical_disk_writes_total[5m])) > 0
        for: 10m
        labels:
          severity: warning
          ostype: windows
        annotations:
          summary: 'WindowsPhysicalDiskHighLatency on {{ $labels.fqdn }}'
          description: 'Physical disk {{ $labels.disk }} latency is {{ $value | humanize }}s (threshold: 400ms)'

      - alert: WindowsPhysicalDiskQueueHigh
        expr: windows_physical_disk_requests_queued > 4
        for: 10m
        labels:
          severity: warning
          ostype: windows
        annotations:
          summary: 'WindowsPhysicalDiskQueueHigh on {{ $labels.fqdn }}'
          description: 'Physical disk {{ $labels.disk }} has {{ $value }} requests queued (threshold: 4)'

      - alert: WindowsProcessorQueueHigh
        expr: |
          windows_system_processor_queue_length
          / clamp_min(count without (core) (windows_cpu_processor_utility_total), 4) > 2
        for: 15m
        labels:
          severity: warning
          ostype: windows
        annotations:
          summary: 'WindowsProcessorQueueHigh on {{ $labels.fqdn }}'
          description: 'Processor queue length per core is {{ $value }} (threshold: 2 per core)'

      - alert: WindowsScheduledTaskFailure
        expr: windows_scheduled_task_last_result{} == 0 and on (instance, task) windows_scheduled_task_state{state="disabled"} == 0 and on (instance, task) windows_scheduled_task_state{state="running"} == 0
        for: 2h
        labels:
          severity: info
          ostype: windows
        annotations:
          summary: 'WindowsScheduledTaskFailure on {{ $labels.fqdn }}'
          description: "Scheduled task '{{ $labels.task }}' failed on last run"

      # ATTENTION: this raises ~500 alerts, as special services are configured for auto start but are not running by design (e.g. Google Update Service, MS Edge Update Service, etc.)
      # - alert: WindowsServiceStatus
      #   expr: windows_service_start_mode{start_mode="auto"} == 1 and ON (instance, name) windows_service_state{state="running"} != 1
      #   for: 5m
      #   labels:
      #     severity: critical
      #     ostype: windows
      #   annotations:
      #     summary: 'WindowsServiceStatus on {{ $labels.fqdn }}'
      #     description: 'Windows Service state is not OK{{"\n"}}ServiceName: {{ $labels.name }}{{"\n"}}VALUE = {{ $value }}'

      - alert: WindowsSystemDiskFilling
        expr: |
          (100 * windows_logical_disk_free_bytes{volume="C:"}
            / windows_logical_disk_size_bytes{volume="C:"} < 15)
          and predict_linear(
            windows_logical_disk_free_bytes{volume="C:"}[6h],
            4 * 24 * 3600
          ) < 0
        for: 10m
        labels:
          severity: warning
          ostype: windows
        annotations:
          summary: 'WindowsSystemDiskFilling on {{ $labels.fqdn }}'
          description: 'System drive C: expected to fill within 4 days. Currently {{ $value | humanize }}% free.'

      - alert: WindowsSystemDiskSpaceUsage
        expr: ((windows_logical_disk_size_bytes{volume="C:"} - windows_logical_disk_free_bytes{volume="C:"}) / windows_logical_disk_size_bytes{volume="C:"} * 100 > 90)
        for: 5m
        labels:
          severity: critical
          ostype: windows
        annotations:
          summary: 'WindowsSystemDiskSpaceUsage on {{ $labels.fqdn }}'
          description: 'Disk Space on Drive ({{ $labels.volume }}) is used more than 90%{{"\n"}}VALUE = {{ $value }}'

      - alert: WindowsTimeZoneMismatch
        expr: windows_time_timezone{timezone!="UTC"} == 1
        for: 5m
        labels:
          severity: info
          ostype: windows
        annotations:
          summary: 'WindowsTimeZoneMismatch on {{ $labels.fqdn }}'
          description: "Current timezone '{{ $labels.timezone }}' is not set to UTC on {{ $labels.fqdn }}"

      # - alert: WindowsUnexpectedReboot
      #   expr: (time() - windows_system_boot_time_timestamp) < 3600
      #   for: 0m
      #   labels:
      #     severity: warning
      #     ostype: windows
      #   annotations:
      #     summary: 'WindowsUnexpectedReboot on {{ $labels.fqdn }}'
      #     description: 'System rebooted less than 1 hour ago on {{ $labels.fqdn }}'

      - alert: WindowsUpdatePendingInfo
        expr: windows_update_pending_info{title!~"(?:Security Intelligence Update for (?:Windows Defender Antivirus|Microsoft Defender Antivirus|Microsoft Security Essentials)|Windows Malicious Software Removal Tool).+"} != 0
        for: 5m
        labels:
          severity: info
          ostype: windows
        annotations:
          summary: 'WindowsUpdatePendingInfo on {{ $labels.fqdn }}'
          description: "Pending Update: '{{ $labels.title }}'"

      - alert: WindowsUpdateServiceDisabled
        expr: windows_service_start_mode{name="wuauserv", start_mode="disabled"} == 1
        for: 5m
        labels:
          severity: warning
          ostype: windows
        annotations:
          summary: 'WindowsUpdateServiceDisabled on {{ $labels.fqdn }}'
          description: "Service 'Windows Update' [{{ $labels.name }}] is currently disabled, please enable the service asap"
